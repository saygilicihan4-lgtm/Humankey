name: HUMANKEY CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only
      - run: npm ci
      - uses: actions/upload-artifact@v4
        with:
          name: humankey-package-lock
          path: package-lock.json
          retention-days: 1
      - run: npx tsc --noEmit
      - run: npm test
