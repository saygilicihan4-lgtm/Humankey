services:
  - type: web
    name: humankey
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npx tsc --noEmit && npm test
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
